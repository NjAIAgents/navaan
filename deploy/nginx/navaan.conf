# NAVAAN Studio vhost for the shared engagehub-nginx. Mounted at /etc/nginx/conf.d/navaan.conf (read only).
# Context: conf.d files are included inside http {}, so map and limit_req_zone are valid here. Names are prefixed navaan_.
# Edge behaviour: specs/001-run-navaan-on-server/contracts/http-edge.md

# Two throttles per client IP (limit_req runs first, so it also slows guessing of the studio login):
#   navaan_anon  strict, 30 req/min: requests without a session cookie of the right shape
#   navaan_all   loose, 300 req/min: every request, so a forged cookie cannot buy unlimited guesses
map $cookie_navaan_session $navaan_anon_key {
    "~^[A-Za-z0-9_-]{43}$"  "";                # looks like a studio session: not in the strict zone
    default               $binary_remote_addr;
}
limit_req_zone $navaan_anon_key      zone=navaan_anon:10m rate=30r/m;
limit_req_zone $binary_remote_addr   zone=navaan_all:10m  rate=300r/m;
limit_req_status 429;

server {
    listen 80;
    listen [::]:80;
    server_name navaan.njlabs.dev;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name navaan.njlabs.dev;

    ssl_certificate     /etc/letsencrypt/live/navaan.njlabs.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/navaan.njlabs.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # No shared password here since 2026-10-14: the studio's own login (password, authenticator code, per-IP lockout) is the gate.
    # To switch the shared password back on, add:  auth_basic "NAVAAN";  auth_basic_user_file /run/navaan/htpasswd;
    # (the hash is still delivered to /opt/navaan/nginx/htpasswd from the Vault key gate.htpasswd)

    limit_req zone=navaan_anon burst=20  nodelay;
    limit_req zone=navaan_all  burst=100 nodelay;

    client_max_body_size 30M;

    # Docker DNS + a variable upstream: nginx still starts, and the other apps keep working, when the navaan container is down.
    resolver 127.0.0.11 valid=10s;
    set $navaan_upstream http://navaan:8765;

    location / {
        proxy_pass $navaan_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization     "";          # the studio does not use it
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
    }
}
