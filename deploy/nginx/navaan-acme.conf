# Stage 1 only: lets certbot issue the certificate before navaan.conf (which needs the cert files) is switched on.
# Mount this file as /etc/nginx/conf.d/navaan.conf for the first run, then replace it with navaan.conf. deploy/nginx/README.md.
server {
    listen 80;
    listen [::]:80;
    server_name navaan.njlabs.dev;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 404; }
}
