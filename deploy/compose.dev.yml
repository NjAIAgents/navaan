# Postgres for development and the tests: docker compose -f deploy/compose.dev.yml up -d
# Listens on 127.0.0.1:5432 only (NAVAAN_PG_PORT=5433 docker compose ... if another Postgres already holds 5432; then set NAVAAN_PG_PORT for the app too),
# no password (trust), role navaan_app, database navaan: the defaults analytics_db uses with nothing configured.
name: navaan-dev
services:
  postgres:
    image: postgres:17-alpine
    container_name: navaan-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: navaan_app
      POSTGRES_DB: navaan
      POSTGRES_HOST_AUTH_METHOD: trust
    ports: ["127.0.0.1:${NAVAAN_PG_PORT:-5432}:5432"]
    volumes: ["navaan-pgdev:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U navaan_app -d navaan"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  navaan-pgdev:
