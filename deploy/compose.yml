# NAVAAN Studio on the Oracle VM. Project "navaan". Run from /opt/navaan/repo:
#   docker compose -f deploy/compose.yml up -d --build      (joins engagehub-network to reach Vault)
# No credential is in this file. Secrets come from Vault at start (deploy/vault_sync.py).
name: navaan

services:
  navaan:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: navaan:local
    container_name: navaan
    restart: unless-stopped
    environment:
      NAVAAN_PUBLIC_HOST: navaan.njlabs.dev
      NAVAAN_LOG_DIR: /home/navaan/.local/share/navaan/logs   # app.jsonl (14 days) and runs/<job>.jsonl on the persistent state folder; see "Logs" in deploy/README.md
      OCI_CLI_AUTH: instance_principal     # the Cloud storage tab runs `oci` with the VM's own identity (no key file on the server)
      NAVAAN_TRUST_PROXY: "1"            # nginx sets X-Real-IP and X-Forwarded-Proto; the port is reachable only on navaan-network
      NAVAAN_SCHEDULER: ${NAVAAN_SCHEDULER:-on}    # the server owns the schedule since 2026-10-14; the Mac runs with NAVAAN_SCHEDULER=off (deploy/README.md)
      NAVAAN_VAULT_ADDR: ${NAVAAN_VAULT_ADDR:-http://engagehub-vault:8200}
      NAVAAN_VAULT_ROLE_ID_FILE: /run/secrets/vault_role_id
      NAVAAN_VAULT_SECRET_ID_FILE: /run/secrets/vault_secret_id
    secrets: [vault_role_id, vault_secret_id]
    volumes:
      - /opt/navaan/data/songs:/app/songs
      - /opt/navaan/data/state:/home/navaan/.local/share/navaan
      - /opt/navaan/data/navaan.config.json:/app/navaan.config.json
      - /opt/navaan/nginx/htpasswd:/gate/htpasswd          # shared password hash for nginx, written from Vault in place
    tmpfs:
      - /home/navaan/.config/navaan:mode=0700,uid=10001,gid=10001,size=16m   # materialised secrets and auth.json, memory only
      - /tmp:size=2g
    networks: [navaan-network, vault]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8765/auth/state', timeout=5)"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 90s   # the entrypoint waits up to 60 s for Vault before starting the portal
    logging:
      driver: json-file
      options: {max-size: 50m, max-file: "5"}   # the JSON log stream goes to stdout too; a shipper such as Grafana Alloy or Promtail can tail it later

networks:
  navaan-network:
    name: navaan-network      # engagehub-nginx joins this one (deploy/nginx/README.md)
  vault:
    external: true
    name: ${VAULT_NETWORK:-engagehub-network}   # where engagehub-vault lives (research.md R10)

secrets:
  vault_role_id:
    file: /opt/navaan/secrets/vault_role_id
  vault_secret_id:
    file: /opt/navaan/secrets/vault_secret_id
