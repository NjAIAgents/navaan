name: ci
# Runs on pull requests into develop and main, on pushes to develop, and is reused by the production deploy.
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env: {POSTGRES_PASSWORD: test, POSTGRES_DB: navaan}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: New app (tests, colour-literal check, build)
        working-directory: plugins/navaan-studio/web
        run: |
          npm ci
          npm test
          npm run build
      - name: Python packages the tests may use
        run: pip install cryptography pillow numpy opencv-python-headless "psycopg[binary]"
      - name: Unit tests (against the Postgres service above)
        env:
          NAVAAN_DATABASE_URL: postgresql://postgres:test@localhost:5432/navaan
        run: python -m unittest discover -s plugins/navaan-studio/tests -p 'test_*.py'
      - name: Browser checks (Playwright at 390x844 and 1280x800, both themes, axe-core) and Lighthouse mobile gate
        working-directory: plugins/navaan-studio/web/e2e
        env:
          NAVAAN_DATABASE_URL: postgresql://postgres:test@localhost:5432/navaan
        run: |
          npm ci
          command -v google-chrome >/dev/null || npx playwright install --with-deps chrome
          npx playwright test
          node lighthouse.mjs
      - name: Browser check results (only when they fail)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: plugins/navaan-studio/web/e2e/test-results
          if-no-files-found: ignore
      - name: Shell scripts parse
        run: |
          for f in deploy/*.sh deploy/backup/*.sh; do bash -n "$f" && echo "ok $f"; done
      - name: Compose file is valid
        run: docker compose -f deploy/compose.yml config -q
