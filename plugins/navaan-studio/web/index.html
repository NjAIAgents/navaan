<!doctype html>
<html lang="en" data-theme="midnight-cinema">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="navaan-token" content="__TOKEN__">
  <meta name="color-scheme" content="dark light">
  <title>NAVAAN</title>
  <meta name="description" content="Every new sound carries an old emotion.">
  <link rel="icon" type="image/png" href="/app/brand/favicon-64.png">
  <link rel="apple-touch-icon" href="/app/brand/apple-touch-icon.png">
  <script>
    // Set the theme before first paint so there is no flash. Mirrors src/theme/themes.ts (a test keeps the ids in step).
    (function () {
      var id = "midnight-cinema", c = "midnight-cinema";
      try { c = localStorage.getItem("navaan.theme") || "midnight-cinema"; } catch (e) { /* private window: dark */ }
      if (c === "ivory-gold") id = c;
      else if (c === "system" && window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) id = "ivory-gold";
      document.documentElement.setAttribute("data-theme", id);
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
