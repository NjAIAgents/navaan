<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NAVAAN Studio</title>
<style>
:root{--bg:#faf8f4;--fg:#1d1b18;--mut:#6f6a62;--card:#fff;--line:#e4dfd6;--acc:#b4531a;--ok:#2b7a4b;--warn:#a86a00}
@media (prefers-color-scheme:dark){:root{--bg:#171512;--fg:#f0ece4;--mut:#a29b8e;--card:#201d19;--line:#35302a;--acc:#e0884f;--ok:#5fc58a;--warn:#e0a53c}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,sans-serif}
header{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center}h1{font-size:18px;margin:0;letter-spacing:.14em}
main{display:grid;grid-template-columns:240px 1fr;min-height:calc(100vh - 54px)}
aside{border-right:1px solid var(--line);padding:14px}section{padding:20px;max-width:980px}
.song{padding:8px 10px;border-radius:8px;cursor:pointer;margin-bottom:4px}.song:hover,.song.on{background:var(--card);outline:1px solid var(--line)}
.song small{display:block;color:var(--mut)}button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:6px 12px;border-radius:8px;cursor:pointer}
button.p{background:var(--acc);border-color:var(--acc);color:#fff}button:disabled{opacity:.5;cursor:default}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.step{display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}.step:last-child{border:0}.step b{flex:1}
.chip{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--mut)}.chip.done{color:var(--ok);border-color:var(--ok)}.chip.waiting{color:var(--warn);border-color:var(--warn)}.chip.ready{color:var(--acc);border-color:var(--acc)}
textarea,input{width:100%;font:13px/1.5 ui-monospace,monospace;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px}textarea{min-height:160px}
video{max-width:100%;max-height:420px;border-radius:10px;background:#000}.row{display:flex;gap:14px;flex-wrap:wrap}pre{white-space:pre-wrap;font-size:12px;color:var(--mut);max-height:200px;overflow:auto}
h2{font-size:15px;margin:0 0 8px}.mut{color:var(--mut)}
.wf{position:relative;margin:6px 0 0}.node{display:flex;gap:12px;position:relative;padding-bottom:10px}
.node:not(:last-child)::before{content:"";position:absolute;left:13px;top:28px;bottom:-2px;width:2px;background:var(--line)}
.node.done:not(:last-child)::before{background:var(--ok)}
.dot{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--mut);z-index:1}
.node.done .dot{background:var(--ok);border-color:var(--ok);color:#fff}.node.running .dot{border-color:var(--acc);color:var(--acc)}.node.waiting .dot{border-color:var(--warn);color:var(--warn);animation:pulse 1.6s infinite}
.node.failed .dot{background:#b3261e;border-color:#b3261e;color:#fff}.node.gate .dot{width:20px;height:20px;margin:4px;border-radius:5px;font-size:11px}
.spin{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}@keyframes pulse{50%{box-shadow:0 0 0 5px rgba(168,106,0,.2)}}
.nb{flex:1;min-width:0}.nt{display:flex;gap:8px;align-items:center;cursor:pointer;min-height:28px}.nt b{font-weight:600}.node.pending .nt b,.node.gate.pending .nt b{color:var(--mut);font-weight:500}
.node.gate .nt b{font-weight:500;font-size:14px}.sub{color:var(--mut);font-size:12px}.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:8px 0 4px}.bar i{display:block;height:100%;background:var(--ok);transition:width .4s}
.nb pre{overflow-wrap:anywhere;margin:6px 0 0;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;max-height:220px}.chip.failed{color:#b3261e;border-color:#b3261e}.chip.running{color:var(--acc);border-color:var(--acc)}
@media(max-width:700px){main{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line)}}
</style></head><body>
<header><h1>NAVAAN STUDIO</h1><span class="mut">local, nothing leaves this computer except what you approve</span></header>
<main><aside><div style="display:flex;gap:6px;margin-bottom:10px"><input id="ns" placeholder="new slug, e.g. song-003"><button onclick="newSong()">Add</button></div><div style="display:flex;gap:6px;margin-bottom:10px"><input id="iu" placeholder="Suno link to import"><button onclick="importSuno()">Import</button></div><div id="list"></div></aside>
<section id="main"><p class="mut">Pick a song or add one.</p></section></main>
<script>
const T="__TOKEN__";let cur=null,timer=null;
const api=(p,b)=>fetch(p,b?{method:"POST",headers:{"Content-Type":"application/json","X-Navaan-Token":T},body:JSON.stringify(b)}:{}).then(r=>r.json());
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const GL={lyrics:"I approve these lyrics",listen:"I listened and accept this song",credits:"I approve spending Suno and Flow credits",captions_setup:"I approve a one time download of the caption tools (about 700 MB from GitHub and PyPI, saved outside the repo)",media:"I reviewed the videos and approve them",publish_youtube:"Publish to YouTube now",publish_short:"Make the Short in YouTube Studio and publish it now",instagram_caption:"I approve this Instagram caption (edit it in the instagram.txt box below and Save first)",publish_instagram:"Publish to Instagram now",cloud_upload:"Upload this finished song to my cloud bucket"};
const OPEN={};
const fmt=n=>n>=60?Math.floor(n/60)+"m "+(n%60)+"s":n+"s";
function gnode(g,state,d){const a=d.approvals[g];const t=lab(g);
if(a)return `<div class="node gate done"><div class="dot">&#10003;</div><div class="nb"><div class="nt"><b>Gate: ${esc(g)}</b><span class="sub">approved ${esc(a.at||"")}</span></div></div></div>`;
if(state==="waiting")return `<div class="node gate waiting"><div class="dot">!</div><div class="nb"><div class="nt"><b>Gate: ${esc(g)}</b><span class="chip waiting">needs you</span></div><div style="margin:4px 0"><button class="p" onclick="gate('${g}')">${esc(t)}</button></div></div></div>`;
return `<div class="node gate pending"><div class="dot">&#9679;</div><div class="nb"><div class="nt"><b>Gate: ${esc(g)}</b><span class="sub">${esc(t)}</span></div></div></div>`}
function wf(d){const R=d.run||{},nx=d.next,rows=d.steps,total=rows.length,done=rows.filter(r=>r.done).length,busy=d.job.running;
const cur=rows.find(r=>R.step===r.id);let h=(d.profile===false?`<div class="card" style="border-color:var(--warn)"><h2 style="color:var(--warn)">No artist profile yet</h2><p style="margin:0">The agents have no palette, motifs or voice to follow, so they guess from earlier songs. Run <code>python3 plugins/navaan-studio/scripts/navaan.py init</code> in your workspace, then re-run the step.</p></div>`:"")+(d.needs_you?`<div class="card" style="border-color:var(--warn)"><h2 style="color:var(--warn)">Action needed from you</h2><p style="margin:0">${esc(d.needs_you)}</p><p class="sub" style="margin:6px 0 0">Switch the account in the Flow tab the agent opened, not in a new tab. The agent checks every 30 seconds and continues by itself. If it timed out, click Retry and continue. If Flow keeps going back to the old account, sign out of that Google account in Chrome, or use a Chrome profile that only has the account with credits.</p></div>`:"")+`<div class="card"><h2>Workflow</h2><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span><b>${done}</b> of ${total} steps done</span>`;
if(busy)h+=`<span class="chip running">${esc(d.status_text||"running")}${R.elapsed!=null?" · "+fmt(R.elapsed):""}</span>`;
else if(R.failed)h+=`<span class="chip failed">step ${esc(R.failed)} failed</span>`;
else if(nx.type==="gate")h+=`<span class="chip waiting">waiting for your approval: ${esc(nx.gate)}</span>`;else if(nx.type==="done")h+=`<span class="chip done">all done</span>`;
h+=`</div><div class="bar"><i style="width:${total?Math.round(100*done/total):0}%"></i></div>`;
if(nx.type!=="done"&&nx.type!=="gate")h+=`<p style="margin:8px 0 0"><button class="p" onclick="runIt(true)" ${busy?"disabled":""}>${busy?"Running...":"Run from here to the end"}</button> <button onclick="runIt(false)" ${busy?"disabled":""}>Run only: ${esc((rows.find(r=>r.id===nx.step)||{}).label||nx.step)}</button> <span class="sub">from here = the next unfinished step, then each one after it, pausing at approvals. Only = just that one step.</span></p>`;
else if(nx.type==="gate"&&busy)h+=`<p class="sub" style="margin:8px 0 0">The workflow is paused here and continues by itself right after you approve.</p>`;
else if(nx.type==="gate")h+=`<p style="margin:8px 0 0"><button class="p" onclick="runIt(true)">Run from here to the end</button> <span class="sub">continues from the next unfinished step and waits at each approval</span></p>`;
h+=`</div></div><div class="card"><div class="wf">`;
for(const r of rows){let st=r.done?"done":R.step===r.id?"running":R.failed===r.id?"failed":(nx.type==="gate"&&nx.step===r.id)?"waiting":"pending";
if(r.gate_before&&!r.done)h+=gnode(r.gate_before,(nx.type==="gate"&&nx.gate===r.gate_before)?"waiting":"pending",d);
const logt=d.logs[r.id]||"";const open=OPEN[r.id]!==undefined?OPEN[r.id]:(st==="running"||st==="failed");
const icon=st==="done"?"&#10003;":st==="running"?'<div class="spin"></div>':st==="failed"?"&#10005;":st==="waiting"?"!":"&#9679;";
const lab={done:"done",running:"running"+(R.attempts>1&&R.attempt?" (try "+R.attempt+" of "+R.attempts+")":"")+(R.elapsed!=null?" · "+fmt(R.elapsed):""),failed:"failed",waiting:"waiting",pending:"not started"}[st];
h+=`<div class="node ${st}"><div class="dot">${icon}</div><div class="nb"><div class="nt" onclick="tog('${r.id}',${!open})"><b>${esc(r.label)}</b><span class="chip ${st==="done"?"done":st==="running"?"running":st==="failed"?"failed":st==="waiting"?"waiting":""}">${lab}</span>${r.kind==="claude"?'<span class="sub">agent</span>':""}${(st==="done"||st==="failed")&&r.redo&&!busy?`<button style="padding:2px 10px;font-size:12px;margin-left:auto" onclick="event.stopPropagation();redoStep('${r.id}',${r.spends})">Redo</button>`:""}</div>`;
if(open&&logt)h+=`<pre>${esc(logt)}</pre>`;else if(open&&st!=="pending")h+=`<div class="sub">no log yet</div>`;
if(st==="failed")h+=`<div class="sub" style="margin:4px 0">Log above. Fix the cause, then click Retry and continue.</div>`;
h+=`</div></div>`;
if(r.gate_after&&r.done)h+=gnode(r.gate_after,(nx.type==="gate"&&nx.gate===r.gate_after)?"waiting":"pending",d)}
return h+`</div></div>`}
async function redoStep(id,sp){if(!confirm('Redo only this step? Its current files go to the _prev folder inside the song (nothing is deleted). Other steps are not touched. If the new run fails, the old files are put back.'+(sp?' It spends credits, so approve the credits gate again first.':'')))return;const r=await api('/api/redo',{slug:cur,step:id});if(r.error)return alert(r.error);OPEN[id]=true;render()}
function tog(id,v){OPEN[id]=v;render()}
let IMP=false;const lab=g=>g==='credits'&&IMP?'I approve spending Flow credits for visuals (the Suno song is already made, nothing more is spent on Suno)':(GL[g]||g);
async function loadList(){const l=await api("/api/songs");document.getElementById("list").innerHTML=l.map(s=>`<div class="song ${s.slug===cur?"on":""}" onclick="openSong('${s.slug}')">${esc(s.slug)}<small>${esc(s.title||"untitled")} · ${esc(s.state||"")}</small></div>`).join("")||'<p class="mut">No songs yet.</p>'}
async function importSuno(){const v=document.getElementById("iu").value.trim();if(!v)return;const r=await api("/api/import",{url:v});if(r.error)return alert(r.error);document.getElementById("iu").value="";await loadList();openSong(r.slug)}
async function newSong(){const v=document.getElementById("ns").value.trim();if(!v)return;const r=await api("/api/new",{slug:v});if(r.error)return alert(r.error);document.getElementById("ns").value="";await loadList();openSong(v)}
let fast=false;
async function openSong(s){cur=s;await loadList();await render();clearTimeout(timer);const tick=async()=>{if(!document.activeElement||document.activeElement.tagName!=="TEXTAREA")await render();timer=setTimeout(tick,fast?1500:4000)};timer=setTimeout(tick,1500)}
let VOL=0.8,MUTE=false,AC=null;try{const v=localStorage.getItem("navaan_vol");if(v!==null)VOL=Math.max(0,Math.min(2,parseFloat(v)||0));MUTE=localStorage.getItem("navaan_mute")==="1"}catch(e){}
function boost(el){if(!el.__g){AC=AC||new (window.AudioContext||window.webkitAudioContext)();const src=AC.createMediaElementSource(el),g=AC.createGain();src.connect(g);g.connect(AC.destination);el.__g=g}if(AC.state==="suspended")AC.resume();return el.__g}
function applyVol(){document.querySelectorAll("audio,video").forEach(el=>{el.muted=MUTE;el.volume=Math.min(1,VOL);if(VOL>1)boost(el).gain.value=VOL;else if(el.__g)el.__g.gain.value=1});
const l=document.getElementById("vl");if(l)l.textContent=MUTE?"muted":Math.round(VOL*100)+"%";const b=document.getElementById("vm");if(b)b.textContent=MUTE?"Unmute":"Mute"}
function setVol(v){VOL=v/100;MUTE=false;try{localStorage.setItem("navaan_vol",VOL);localStorage.setItem("navaan_mute","0")}catch(e){}applyVol()}
function toggleMute(){MUTE=!MUTE;try{localStorage.setItem("navaan_mute",MUTE?"1":"0")}catch(e){}applyVol()}
let shown=null;
function setSec(id,html){const main=document.getElementById("main");let el=document.getElementById(id);if(!el){el=document.createElement("div");el.id=id;main.appendChild(el)}if(el.dataset.h!==html){el.innerHTML=html;el.dataset.h=html}}
async function render(){if(!cur)return;const d=await api("/api/song/"+cur);if(d.error){document.getElementById("main").innerHTML=esc(d.error);shown=null;return}
if(shown!==cur){document.getElementById("main").innerHTML="";shown=cur}
IMP=d.meta.source==="suno_import";fast=!!d.job.running;const f=d.files,m=n=>`/media/${cur}/${n}?v=${f[n]||0}`;
setSec("s_top",`<h2 style="font-size:20px">${esc(cur)} <span class="chip">${esc(d.meta.state||"")}</span></h2>`+wf(d));
let md="";const vids=["final_reel_cap.mp4","final_16x9_cap.mp4","final_reel_sync.mp4","final_16x9.mp4"].filter(n=>f[n]).concat(Object.keys(f).filter(n=>n.startsWith("clips~")));if(f["final.mp3"])md+=`<div class="card"><h2>Song</h2><audio controls preload="metadata" src="${m("final.mp3")}" style="width:100%"></audio></div>`;
if(vids.length)md+=`<div class="card"><h2>Review videos</h2><div class="row">${vids.map(n=>`<div><div class="mut">${n.startsWith("clips~")?"Flow clip: "+n.slice(6):/_cap\.mp4$/.test(n)?n+" (with lyrics)":n}</div><video controls preload="metadata" src="${m(n)}"></video></div>`).join("")}</div></div>`;
setSec("s_vol",md?`<div class="card" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><b>Volume</b><input type="range" min="0" max="200" step="1" value="${Math.round(VOL*100)}" oninput="setVol(this.value)" style="flex:1;min-width:140px;width:auto;padding:0"><span id="vl" style="min-width:48px">${Math.round(VOL*100)}%</span><button id="vm" onclick="toggleMute()">${MUTE?"Unmute":"Mute"}</button><span class="sub">above 100% boosts a quiet song</span></div>`:"");
setSec("s_media",md);applyVol();
setSec("s_appr",`<div class="card"><h2>Approvals</h2>`+d.gates.map(g=>{const a=d.approvals[g];return `<div class="step"><b>${esc(g)}</b><span class="chip ${a?"done":""}">${a?"approved "+esc(a.at):"not approved"}</span>${a?`<button onclick="revoke('${g}')">Revoke</button>`:`<button onclick="gate('${g}')">Approve</button>`}</div>`}).join("")+`<p class="mut">Only a click here or the approve command can unlock publishing. Agents cannot.</p></div>`);
let tx="";for(const n of Object.keys(d.text))tx+=`<div class="card"><h2>${esc(n)}</h2><textarea id="t_${n}">${esc(d.text[n])}</textarea><p><button onclick="save('${n}')">Save</button></p></div>`;
if(!document.activeElement||document.activeElement.tagName!=="TEXTAREA")setSec("s_text",tx);
loadList()}
async function gate(g){if(!confirm("Approve: "+lab(g)+"?"))return;await api("/api/approve",{slug:cur,gate:g});render()}
async function revoke(g){await api("/api/revoke",{slug:cur,gate:g});render()}
async function runIt(all){await api("/api/run",{slug:cur,all:!!all});render()}
async function save(n){const r=await api("/api/save",{slug:cur,file:n,content:document.getElementById("t_"+n).value});alert(r.error||"saved")}
loadList();
</script></body></html>
