<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NAVAAN sign in</title>
<style>
:root{--bg:#0B0B10;--card:#15151E;--line:#2C2C3A;--fg:#F3F3F7;--mut:#9B9BB0;--acc:#FF4D7E;--vio:#8B5CF6;--ok:#22C55E;--bad:#FF7A7A;--input:#3F3F52}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(900px 500px at 50% -10%,#241437,var(--bg));color:var(--fg);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.box{width:min(420px,92vw);background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px}
h1{margin:0 0 4px;font-size:22px;letter-spacing:.5px}.sub{color:var(--mut);margin:0 0 18px;font-size:13px}
label{display:block;font-size:12px;color:var(--mut);margin:12px 0 4px}
input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--input);background:#0F0F16;color:var(--fg);font-size:15px}
input:focus{outline:2px solid var(--vio);border-color:transparent}
button{width:100%;margin-top:16px;padding:11px;border:0;border-radius:10px;background:linear-gradient(90deg,var(--acc),var(--vio));color:#fff;font-weight:600;font-size:15px;cursor:pointer}
button.alt{background:transparent;border:1px solid var(--input);color:var(--fg);margin-top:10px;font-weight:500}
button:disabled{opacity:.5;cursor:wait}.err{color:var(--bad);font-size:13px;min-height:18px;margin-top:10px}
.qr{background:#fff;border-radius:12px;padding:6px;width:210px;margin:10px auto}.qr svg{width:100%;height:auto;display:block}
.mono{font-family:ui-monospace,Menlo,monospace}.codes{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:12px 0;padding:12px;border:1px dashed var(--line);border-radius:10px;font-family:ui-monospace,Menlo,monospace;font-size:14px}
.tabs{display:flex;gap:6px;margin-bottom:6px}.tabs a{flex:1;text-align:center;padding:7px;border:1px solid var(--line);border-radius:8px;color:var(--mut);cursor:pointer;font-size:13px}.tabs a.on{color:var(--fg);border-color:var(--vio);background:#1d1830}
.small{font-size:12px;color:var(--mut)}.sec{word-break:break-all;background:#0F0F16;padding:8px;border-radius:8px;font-size:12px;margin-top:6px}
/* animated backdrop: notes, play buttons, reels and a camera glyph drifting upward like a feed, soft orbs, an equaliser along the bottom */
#bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.orb{position:absolute;width:46vmax;height:46vmax;border-radius:50%;filter:blur(70px);opacity:.28;animation:orb 26s ease-in-out infinite alternate}
.o1{left:-14vmax;top:-12vmax;background:radial-gradient(circle,#8B5CF6,transparent 65%)}.o2{right:-16vmax;bottom:-18vmax;background:radial-gradient(circle,#FF4D7E,transparent 65%);animation-duration:32s;animation-delay:-9s}
@keyframes orb{to{transform:translate3d(6vmax,4vmax,0) scale(1.15)}}
.f{position:absolute;bottom:-90px;left:var(--x);width:var(--s);height:var(--s);color:var(--c);opacity:0;animation:rise var(--d) linear var(--dl) infinite;will-change:transform,opacity}
.f svg{width:100%;height:100%;display:block;overflow:visible;fill:currentColor;animation:sway var(--w) ease-in-out var(--dl) infinite alternate}
.f.b svg{filter:blur(2px)}
@keyframes rise{0%{transform:translate3d(0,0,0) rotate(var(--r0));opacity:0}8%{opacity:var(--o)}92%{opacity:var(--o)}100%{transform:translate3d(var(--dr),calc(-100vh - 180px),0) rotate(var(--r1));opacity:0}}
@keyframes sway{from{transform:translateX(-16px) rotate(-7deg)}to{transform:translateX(16px) rotate(7deg)}}
.eq{position:absolute;left:0;right:0;bottom:0;height:110px;display:flex;align-items:flex-end;justify-content:center;gap:5px;padding:0 2vw;opacity:.22;-webkit-mask-image:linear-gradient(to top,#000,transparent);mask-image:linear-gradient(to top,#000,transparent)}
.eq i{flex:1;max-width:14px;height:100%;border-radius:6px 6px 0 0;background:linear-gradient(to top,var(--acc),var(--vio));transform-origin:bottom;transform:scaleY(.15);animation:eq var(--t) ease-in-out var(--dl) infinite alternate}
@keyframes eq{to{transform:scaleY(var(--h))}}
.studio{display:inline-flex;align-items:flex-end;gap:3px;margin-left:8px;padding:2px 10px 2px 6px;vertical-align:baseline;font:italic 700 34px/1 "Snell Roundhand","Brush Script MT","Segoe Script","Apple Chancery","Lucida Handwriting",cursive;background:repeating-linear-gradient(to bottom,transparent 0 6px,rgba(183,156,255,.34) 6px 7px) 0 3px/100% 36px no-repeat}
.studio i{font-style:inherit;display:inline-block;transform:translateY(var(--y));color:var(--c);text-shadow:0 0 12px color-mix(in srgb,var(--c) 45%,transparent);animation:hop 2.8s ease-in-out infinite}
.studio i:nth-child(1){--y:-2px;--c:#FF4D7E}.studio i:nth-child(2){--y:-9px;--c:#FF6C9A;animation-delay:.15s}.studio i:nth-child(3){--y:-4px;--c:#C27BE8;animation-delay:.3s}
.studio i:nth-child(4){--y:-13px;--c:#A77BF5;animation-delay:.45s}.studio i:nth-child(5){--y:-6px;--c:#9B6DF7;animation-delay:.6s}.studio i:nth-child(6){--y:-15px;--c:#8B5CF6;animation-delay:.75s}
.studio::after{content:"\266B";margin-left:4px;font-style:normal;font-size:20px;color:#B79CFF;align-self:center;animation:hop 2.8s ease-in-out .9s infinite;--y:0px}
@keyframes hop{0%,100%{transform:translateY(var(--y))}50%{transform:translateY(calc(var(--y) - 5px))}}
@media (prefers-reduced-motion:reduce){.studio i,.studio::after{animation:none}}
h1.brand::after{content:"by NJLABS";display:block;margin-top:3px;font-size:11px;font-weight:600;letter-spacing:.22em;color:var(--mut);background:linear-gradient(90deg,var(--acc),var(--vio));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.cr{position:fixed;left:0;right:0;bottom:10px;z-index:2;text-align:center;font-size:12px;color:#B9B9CC;text-shadow:0 1px 6px #0B0B10,0 0 2px #0B0B10;pointer-events:none}
.box{position:relative;z-index:1;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
@media (prefers-reduced-motion:reduce){.orb,.f,.f svg,.eq i{animation:none}.f{bottom:auto;top:var(--y);opacity:var(--o)}.eq i{transform:scaleY(var(--h))}}
</style></head><body><div id="bg" aria-hidden="true"><i class="orb o1"></i><i class="orb o2"></i><div id="fl"></div><div class="eq" id="eq"></div></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="note" viewBox="0 0 24 24"><circle cx="7" cy="18" r="3.2"/><circle cx="17" cy="16" r="3.2"/><path d="M10 18V6.5l10-2.2V16" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M10 6.5l10-2.2v3.2l-10 2.2z"/></symbol>
<symbol id="note1" viewBox="0 0 24 24"><circle cx="8" cy="18" r="3.4"/><path d="M11.4 18V3.5c3.6.4 6 2.4 6.6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
<symbol id="yt" viewBox="0 0 24 24"><rect x="1" y="4.5" width="22" height="15" rx="4.6"/><path d="M9.8 8.8l5.6 3.2-5.6 3.2z" style="fill:#0B0B10"/></symbol>
<symbol id="ig" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5.5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="17.3" cy="6.7" r="1.3"/></symbol>
<symbol id="reel" viewBox="0 0 24 24"><rect x="5" y="1.5" width="14" height="21" rx="3.2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M10.4 9l4.4 3-4.4 3z"/></symbol>
<symbol id="heart" viewBox="0 0 24 24"><path d="M12 21s-8-5.2-8-11a4.6 4.6 0 0 1 8-3 4.6 4.6 0 0 1 8 3c0 5.8-8 11-8 11z"/></symbol>
</defs></svg>
<div class="box" id="box"><p class="sub">Loading...</p></div>
<footer class="cr">NAVAAN Studio, built by NJLABS &nbsp;&middot;&nbsp; &copy; <span id="cry"></span> NJLABS. All rights reserved.</footer>
<script>
const $=id=>document.getElementById(id);const box=$("box");let TK="";
const post=(p,b)=>fetch(p,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b||{})}).then(async r=>({s:r.status,j:await r.json().catch(()=>({error:"bad reply"}))}));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function err(m){const e=$("err");if(e)e.textContent=m||""}
async function start(){const r=await fetch("/auth/state").then(r=>r.json());const sc=r.secrets;if(sc&&sc.status!=="ok"){const b=document.createElement("div");b.className="small";b.style.cssText="text-align:center;padding:10px;color:#FFB020";b.textContent="Secrets waiting ("+(sc.status==="sealed"?"Vault is sealed":"Vault not reachable")+"). Publishing and Claude steps pause until it clears.";document.body.prepend(b)}if(r.state==="authed")return location.replace("/");r.state==="setup"?setup1():login(r)}
function setup1(){box.innerHTML=`<h1 class="brand">NAVAAN <span class="studio" aria-label="Studio"><i>S</i><i>t</i><i>u</i><i>d</i><i>i</i><i>o</i></span></h1><p class="sub">First run: create your login. You will use a password plus an authenticator app.</p>
<label>Setup code <span class="small">(in the file ~/.config/navaan/auth_setup_code on this computer)</span></label><input id="c" autocomplete="off" placeholder="xxxx-xxxx-xxxx">
<label>User name</label><input id="u" value="navjyot" autocomplete="username">
<label>Password (12 characters or more)</label><input id="p" type="password" autocomplete="new-password">
<label>Repeat password</label><input id="p2" type="password" autocomplete="new-password">
<div class="err" id="err"></div><button id="go">Continue</button>`;
$("go").onclick=async()=>{if($("p").value!==$("p2").value)return err("Passwords do not match.");$("go").disabled=true;const r=await post("/auth/setup/start",{code:$("c").value,user:$("u").value,password:$("p").value});$("go").disabled=false;if(r.s!==200)return err(r.j.error);setup2(r.j)}}
function setup2(j){box.innerHTML=`<h1>Authenticator app</h1><p class="sub">Scan this with Google Authenticator, Authy, 1Password or similar, then type the 6 digit code.</p>
<div class="qr">${j.qr}</div><div class="small">Cannot scan? Enter this key by hand:</div><div class="sec mono">${esc(j.secret)}</div>
<label>6 digit code</label><input id="t" inputmode="numeric" maxlength="7" autocomplete="one-time-code"><div class="err" id="err"></div><button id="go">Verify and finish</button>`;
$("t").focus();$("t").onkeydown=e=>{if(e.key==="Enter")$("go").click()};
$("go").onclick=async()=>{$("go").disabled=true;const r=await post("/auth/setup/finish",{code:$("t").value});$("go").disabled=false;if(r.s!==200)return err(r.j.error);setup3(r.j.recovery)}}
function setup3(codes){box.innerHTML=`<h1>Save your recovery codes</h1><p class="sub">Each code works once if you lose the phone. They are shown only now. Store them in a password manager, not in this project.</p>
<div class="codes">${codes.map(c=>`<span>${esc(c)}</span>`).join("")}</div><button class="alt" id="cp">Copy codes</button><button id="go">I saved them, open NAVAAN</button>`;
$("cp").onclick=()=>{navigator.clipboard.writeText(codes.join("\n")).then(()=>$("cp").textContent="Copied")};$("go").onclick=()=>location.replace("/")}
async function pkLogin(){err("");try{const o=await post("/auth/passkey/begin",{});if(o.s!==200)return err(o.j.error);const c=await navigator.credentials.get({publicKey:{challenge:u2b(o.j.challenge),rpId:o.j.rpId,timeout:o.j.timeout,userVerification:"required",allowCredentials:o.j.allowCredentials.map(a=>({type:a.type,id:u2b(a.id)}))}});
const r=await post("/auth/passkey/login",{ticket:o.j.ticket,id:b2u(c.rawId),clientDataJSON:b2u(c.response.clientDataJSON),authenticatorData:b2u(c.response.authenticatorData),signature:b2u(c.response.signature)});if(r.s!==200)return err(r.j.error);location.replace("/")}catch(e){err("Passkey cancelled or failed: "+(e.name||e))}}
function login(st){const pk=st.passkey_ready&&window.PublicKeyCredential;box.innerHTML=`<h1 class="brand">NAVAAN <span class="studio" aria-label="Studio"><i>S</i><i>t</i><i>u</i><i>d</i><i>i</i><i>o</i></span></h1><p class="sub">Sign in to the studio.</p>${pk?'<button id="pk" type="button">Sign in with passkey</button><div class="small" style="text-align:center;margin:14px 0 2px">or use your password</div>':""}<label>User name</label><input id="u" autocomplete="username"><label>Password</label><input id="p" type="password" autocomplete="current-password">
<div class="err" id="err">${st.locked?"Locked for "+st.locked+" s after too many tries.":""}</div><button id="go">Continue</button>`;
if(pk)$("pk").onclick=pkLogin;$("u").focus();[$("u"),$("p")].forEach(i=>i.onkeydown=e=>{if(e.key==="Enter")$("go").click()});
$("go").onclick=async()=>{$("go").disabled=true;const r=await post("/auth/login",{user:$("u").value,password:$("p").value});$("go").disabled=false;if(r.s!==200)return err(r.j.error);TK=r.j.ticket;mfa(r.j.passkeys,st.passkey_ready)}}
function mfa(hasKey,ready){const pk=hasKey&&ready&&window.PublicKeyCredential;
box.innerHTML=`<h1>Second step</h1><p class="sub">Confirm it is you.</p><div class="tabs"><a id="t1" class="on">Authenticator</a>${pk?'<a id="t2">Passkey</a>':""}<a id="t3">Recovery code</a></div><div id="pane"></div><div class="err" id="err"></div>`;
const tab=n=>{["t1","t2","t3"].forEach(k=>$(k)&&$(k).classList.toggle("on",k===n));err("");n==="t1"?code("6 digit code","123456"):n==="t3"?code("Recovery code","xxxxxx-xxxxxx"):key()};
["t1","t2","t3"].forEach(k=>$(k)&&($(k).onclick=()=>tab(k)));tab(pk?"t1":"t1")}
function code(lab,ph){$("pane").innerHTML=`<label>${lab}</label><input id="t" autocomplete="one-time-code" placeholder="${ph}"><button id="go">Sign in</button>`;$("t").focus();$("t").onkeydown=e=>{if(e.key==="Enter")$("go").click()};
$("go").onclick=async()=>{$("go").disabled=true;const r=await post("/auth/mfa",{ticket:TK,code:$("t").value});$("go").disabled=false;if(r.s!==200){err(r.j.error);if(r.s===401&&/expired|Too many wrong/.test(r.j.error))setTimeout(start,1200);return}location.replace("/")}}
const b2u=b=>{let s="";new Uint8Array(b).forEach(x=>s+=String.fromCharCode(x));return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")};
const u2b=s=>Uint8Array.from(atob(s.replace(/-/g,"+").replace(/_/g,"/")+"=".repeat((4-s.length%4)%4)),c=>c.charCodeAt(0));
function key(){$("pane").innerHTML=`<p class="small">Use Touch ID, Windows Hello or your security key.</p><button id="go">Use passkey</button>`;$("go").onclick=async()=>{err("");
try{const o=await post("/auth/passkey/login-options",{ticket:TK});if(o.s!==200)return err(o.j.error);const c=await navigator.credentials.get({publicKey:{challenge:u2b(o.j.challenge),rpId:o.j.rpId,timeout:o.j.timeout,userVerification:"required",allowCredentials:o.j.allowCredentials.map(a=>({type:a.type,id:u2b(a.id)}))}});
const r=await post("/auth/passkey/login",{ticket:TK,id:b2u(c.rawId),clientDataJSON:b2u(c.response.clientDataJSON),authenticatorData:b2u(c.response.authenticatorData),signature:b2u(c.response.signature)});if(r.s!==200)return err(r.j.error);location.replace("/")}catch(e){err("Passkey cancelled or failed: "+(e.name||e))}}}
start();
</script>
<script>
document.getElementById("cry").textContent=new Date().getFullYear();
(function(){var R=Math.random,P=["#FF4D7E","#8B5CF6","#B79CFF","#FF86A6","#F3F3F7"],T=["note","note1","note","yt","ig","reel","heart"],fl=document.getElementById("fl"),eq=document.getElementById("eq");
if(!fl||!eq)return;var n=window.innerWidth<600?14:26,h="";
for(var i=0;i<n;i++){var t=T[Math.floor(R()*T.length)],s=26+Math.floor(R()*(t==="yt"||t==="reel"?46:38)),d=16+R()*22;
h+='<span class="f'+(R()<.3?' b':'')+'" style="--x:'+(R()*96).toFixed(1)+'vw;--s:'+s+'px;--d:'+d.toFixed(1)+'s;--dl:-'+(R()*d).toFixed(1)+'s;--w:'+(3+R()*4).toFixed(1)+'s;--dr:'+Math.round(R()*160-80)+'px;--r0:'+Math.round(R()*50-25)+'deg;--r1:'+Math.round(R()*90-45)+'deg;--o:'+(.12+R()*.2).toFixed(2)+';--y:'+Math.round(R()*85)+'vh;--c:'+P[Math.floor(R()*P.length)]+'"><svg><use href="#'+t+'"/></svg></span>'}
fl.innerHTML=h;var b="",m=Math.min(64,Math.floor(window.innerWidth/19));
for(var j=0;j<m;j++)b+='<i style="--h:'+(.25+R()*.75).toFixed(2)+';--t:'+(.7+R()*1.3).toFixed(2)+'s;--dl:-'+(R()*2).toFixed(2)+'s"></i>';eq.innerHTML=b})();
</script></body></html>
